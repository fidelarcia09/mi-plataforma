<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">
<title>Comprar producto</title>

<style>

body {
    margin:0;
    font-family:Arial, sans-serif;
    background:#f4f5ff;
    color:#172033;
}

.contenedor {
    max-width:600px;
    margin:40px auto;
    padding:20px;
}

.tarjeta {
    background:white;
    padding:30px;
    border-radius:20px;
    box-shadow:0 5px 20px #ddd;
    text-align:center;
}

h1 {
    color:#4f46e5;
}

.boton {
    display:inline-block;
    margin-top:20px;
    padding:12px 25px;
    background:#4f46e5;
    color:white;
    text-decoration:none;
    border-radius:8px;
}

</style>

</head>

<body>

<div class="contenedor">

<div class="tarjeta">

<h1>🛒 Comprar producto</h1>

<h2 id="nombre"></h2>

<p id="precio"></p>

<a href="confirmacion-compra.html" class="boton">
    Continuar compra
</a>

</div>

</div>


<script>

const datos = new URLSearchParams(window.location.search);
const nombreProducto = datos.get("producto");

const productos = JSON.parse(
    localStorage.getItem("productos") || "[]"
);

const producto = productos.find(function(p) {
    return p.nombre === nombreProducto;
});

if (producto) {

    document.getElementById("nombre").textContent =
        producto.nombre;

    document.getElementById("precio").textContent =
        "Precio: $" + producto.precio;

} else {

    document.getElementById("nombre").textContent =
        "Producto no encontrado";

    document.getElementById("precio").textContent =
        "";
}

        </script>
    
<script>
const datosCompra2 = new URLSearchParams(window.location.search);

const productoCompra = datosCompra2.get("producto");
const precioCompra = datosCompra2.get("precio");

document.getElementById("continuarCompra").href =
    "confirmacion-compra.html?producto=" +
    encodeURIComponent(productoCompra || "") +
    "&precio=" +
    encodeURIComponent(precioCompra || "");
</script>
        
</body>
    
</html>
