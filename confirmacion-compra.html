<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Confirmar compra</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f5ff;
            color: #182033;
        }

        .contenedor {
            max-width: 600px;
            margin: 60px auto;
            padding: 20px;
        }

        .tarjeta {
            background: white;
            padding: 35px 25px;
            border-radius: 22px;
            text-align: center;
            box-shadow: 0 5px 25px rgba(0,0,0,0.08);
        }

        h1 {
            color: #4f46e5;
        }

        .boton {
            display: inline-block;
            margin-top: 25px;
            padding: 14px 25px;
            background: #4f46e5;
            color: white;
            text-decoration: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
        }

        .volver {
            display: block;
            margin-top: 25px;
            color: #4f46e5;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="contenedor">

    <div class="tarjeta">

        <h1>🛒 Confirmar compra</h1>

        <p>Estás a un paso de completar tu compra.</p>

        <h2>💳 Método de pago</h2>

        <p>Próximamente podrás realizar el pago directamente desde nuestra plataforma.</p>

        <a id="irPago" href="#" class="boton">
    Continuar al pago 💳
        </a>

        <a href="productos.html" class="volver">
            ← Volver a mis productos
        </a>

    </div>

</div>
    
 <script>
const datosCompra = new URLSearchParams(window.location.search);

const producto = datosCompra.get("producto");
const precio = datosCompra.get("precio");

document.getElementById("irPago").href =
    "pago.html?producto=" +
    encodeURIComponent(producto || "") +
    "&precio=" +
    encodeURIComponent(precio || "");
 </script>
    
</body>

</html>
