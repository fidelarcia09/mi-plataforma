<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cuenta creada</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f6ff;
            color: #172033;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .confirmacion {
            background: white;
            width: 90%;
            max-width: 500px;
            padding: 50px 25px;
            border-radius: 25px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
        }

        .icono {
            font-size: 60px;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 35px;
            margin-bottom: 15px;
        }

        p {
            font-size: 18px;
            color: #667085;
            line-height: 1.6;
        }

        .boton {
            display: inline-block;
            margin-top: 25px;
            padding: 16px 30px;
            background: #5146e5;
            color: white;
            text-decoration: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: bold;
        }

        .boton:hover {
            background: #4036c7;
        }
    </style>
</head>

<body>

    <div class="confirmacion">

        <div class="icono">✅</div>

        <h1>¡Cuenta creada!</h1>

        <p>
            Tu cuenta ha sido creada correctamente.
            Ya puedes comenzar a utilizar Mi Plataforma.
        </p>

        <a href="index.html" class="boton">
            Ir al inicio
        </a>

    </div>

</body>

</html>
