<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Crear producto - Mi Plataforma</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f4ff;
            color: #20243a;
        }

        .encabezado {
            background: #5146e5;
            color: white;
            text-align: center;
            padding: 45px 20px;
        }

        .encabezado h1 {
            margin: 0;
            font-size: 38px;
        }

        .encabezado p {
            font-size: 19px;
            margin-top: 15px;
        }

        .contenedor {
            max-width: 700px;
            margin: 45px auto;
            padding: 0 20px;
        }

        .formulario {
            background: white;
            padding: 35px;
            border-radius: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        }

        .formulario h2 {
            margin-top: 0;
            font-size: 28px;
        }

        label {
            display: block;
            margin-top: 22px;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input,
        textarea {
            width: 100%;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 12px;
            font-size: 16px;
        }

        textarea {
            min-height: 120px;
            resize: vertical;
        }

        .boton {
            width: 100%;
            margin-top: 28px;
            padding: 16px;
            border: none;
            border-radius: 12px;
            background: #5146e5;
            color: white;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }

        .volver {
            display: block;
            text-align: center;
            margin-top: 25px;
            color: #5146e5;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <header class="encabezado">
        <h1>Crear producto 📦</h1>
        <p>Publica tu producto digital en Mi Plataforma</p>
    </header>

    <main class="contenedor">

        <div class="formulario">

            <h2>Información del producto</h2>

            <form action="producto-publicado.html">

                <label for="nombre">Nombre del producto</label>

                <input
                    type="text"
                    id="nombre"
                    placeholder="Ej: Curso de Marketing Digital"
                    required
                >

                <label for="descripcion">Descripción</label>

                <textarea
                    id="descripcion"
                    placeholder="Describe tu producto..."
                    required
                ></textarea>

                <label for="precio">Precio</label>

                <input
                    type="number"
                    id="precio"
                    placeholder="Ej: 29.99"
                    min="0"
                    step="0.01"
                    required
                >

                <label for="imagen">Imagen del producto</label>

                <input
                    type="file"
                    id="imagen"
                    accept="image/*"
                >

                <label for="enlace">Enlace del producto</label>

                <input
                    type="url"
                    id="enlace"
                    placeholder="https://..."
                >

                <button type="submit" class="boton">
                    Publicar producto 🚀
                </button>

            </form>
            <script>
const formulario = document.querySelector("form");

formulario.addEventListener("submit", function(event) {
    event.preventDefault();

    const producto = {
        nombre: document.getElementById("nombre").value,
        descripcion: document.getElementById("descripcion").value,
        precio: document.getElementById("precio").value,
        enlace: document.getElementById("enlace").value
    };

    let productos = JSON.parse(localStorage.getItem("productos")) || [];

    productos.push(producto);

    localStorage.setItem("productos", JSON.stringify(productos));

    window.location.href = "productos.html";
});
            </script>
            
            <a href="productos.html" class="volver">
                ← Volver a mis productos
            </a>

        </div>

    </main>

</body>
</html>
