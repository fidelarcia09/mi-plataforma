<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mi cuenta - Mi Plataforma</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5ff;
            color: #20233a;
        }

        header {
            background: #5146e5;
            color: white;
            text-align: center;
            padding: 35px 20px;
        }

        h1 {
            margin: 0;
            font-size: 32px;
        }

        .contenedor {
            max-width: 700px;
            margin: 30px auto;
            padding: 20px;
        }

        .tarjeta {
            background: white;
            padding: 25px;
            margin-bottom: 20px;
            border-radius: 20px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }

        .tarjeta h2 {
            margin-top: 0;
        }

        .boton {
            display: inline-block;
            background: #5146e5;
            color: white;
            padding: 14px 25px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: bold;
        }

        .volver {
            display: block;
            text-align: center;
            margin-top: 25px;
            color: #5146e5;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <header>
        <h1>Mi cuenta 👤</h1>
        <p>Administra tu información</p>
    </header>

    <div class="contenedor">

        <div class="tarjeta">
            <h2>Información de la cuenta</h2>

            <p><strong>Nombre:</strong> Usuario</p>

            <p><strong>Correo:</strong> usuario@email.com</p>
        </div>

        <div class="tarjeta">
            <h2>Mis actividades</h2>

            <p>
                Aquí podrás administrar tus productos,
                ventas y actividades dentro de la plataforma.
            </p>
        </div>

        <a class="boton" href="panel.html">
            ← Volver al panel
        </a>

        <a class="volver" href="index.html">
            Volver al inicio
        </a>

    </div>

</body>

</html>
