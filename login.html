<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Iniciar sesión - Mi Plataforma</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f6ff;
            color: #172033;
        }

        .contenedor {
            max-width: 420px;
            margin: 80px auto;
            background: white;
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
        }

        h1 {
            text-align: center;
            font-size: 38px;
            margin-bottom: 10px;
        }

        .descripcion {
            text-align: center;
            color: #687086;
            margin-bottom: 30px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 15px;
            margin-bottom: 20px;
            border: 1px solid #d9dce8;
            border-radius: 10px;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 10px;
            background: #5146e5;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #4036c7;
        }

        .volver {
            display: block;
            text-align: center;
            margin-top: 25px;
            color: #5146e5;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <div class="contenedor">

        <h1>Iniciar sesión</h1>

        <p class="descripcion">
            Entra a tu cuenta de Mi Plataforma
        </p>

        <form>

            <label>Correo electrónico</label>

            <input
                type="email"
                placeholder="tu@email.com"
                required
            >

            <label>Contraseña</label>

            <input
                type="password"
                placeholder="Tu contraseña"
                required
            >

            <button type="submit">
                Iniciar sesión
            </button>

        </form>

        <a class="volver" href="index.html">
            ← Volver al inicio
        </a>

    </div>

</body>

</html>
