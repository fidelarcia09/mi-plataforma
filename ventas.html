<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ventas</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f5f5ff;
            color: #182033;
        }

        header {
            background: white;
            padding: 25px 20px;
            text-align: center;
        }

        main {
            padding: 30px 20px;
            max-width: 700px;
            margin: auto;
        }

        .tarjeta {
            background: white;
            padding: 25px;
            border-radius: 20px;
            margin-bottom: 20px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }

        .numero {
            font-size: 32px;
            font-weight: bold;
            margin-top: 10px;
        }

        .volver {
            display: inline-block;
            margin-top: 20px;
            color: #5146e5;
            text-decoration: none;
            font-size: 18px;
        }
    </style>
</head>

<body>

<header>
    <h1>💰 Ventas</h1>
    <p>Consulta tus ventas y ganancias.</p>
</header>

<main>

    <div class="tarjeta">
        <h2>💵 Ganancias</h2>
        <div class="numero">$0.00</div>
    </div>

    <div class="tarjeta">
        <h2>🛒 Ventas realizadas</h2>
        <div class="numero">0</div>
    </div>

    <div class="tarjeta">
        <h2>📊 Historial</h2>
        <p>Aquí aparecerán tus ventas cuando comiences a vender productos.</p>
    </div>

    <a href="panel.html" class="volver">← Volver al panel</a>

</main>

</body>
</html>
